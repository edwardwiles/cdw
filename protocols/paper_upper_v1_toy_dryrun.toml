# TOY dry-run manifest (protocol section 26 release gate) -- NOT paper_upper_v1 itself. Small W,
# 2 families, 2 deltas, drastically short stage budgets, purely to prove the orchestrator's
# mechanics (stage sequencing, checkpointing, resume, idempotence, extension-writes-separately)
# before trusting family_start_chain.jl at real protocol scale/budgets.

[protocol]
name = "paper_upper_v1_toy_dryrun"
created_utc = "2026-08-08"
description = "Toy release-gate dry run -- small W, 2 families, 2 deltas, short budgets."

[source]
repo = "/bbkinghome/edav/cdw"
base_branch = "origin/production/fullA-exact"
base_sha = "4df5254"
protocol_branch = "protocol/paper-upper-v1-2026-08-08"
protocol_sha = "toy-dryrun-local"
require_clean_worktree = false

[scientific]
D = 20
focal_country = "France"
sigma = 3.0
W = 20000
draw_design = "sobol_randomized"
draw_seed = 20260719
destination_sample = "exclude_row"
exclude_diagonal_gravity = true
gravity_exclude_cells = "default_gravity_exclude_cells_brazil_korea"
inner_lower_limit = -10.0
A_coordinate_mode = "powered_aspace"
direction = "upper"
find_smallest = true
bound = "upper_only"
deltas = [1.0, 2.0]
z_halfwidth = 30.0
verification_backend = "operator"

[scientific.verification_tolerances]
primal_dual_gap_tol = 1.0e-3
mean_m_resid_tol = 1.0e-6
max_abs_moment_kkt_resid_tol = 1.0e-3
m_min_floor = 0.0

[families.COMMON_MARGINALS]
driver = "run_cm_upper_checkpointed"
delta_restoration_driver = "run_cm_upper_checkpointed"
[families.COMMON_MARGINALS.kwargs]
marginal_restriction = "common_flexible"
cm_extension = "cm_only"
L = 50
contrasts = "orthonormal"
include_truncated_moment = false

[families.ORIGIN_ZC]
driver = "run_originzc_upper_checkpointed"
delta_restoration_driver = "run_originzc_upper_checkpointed"
[families.ORIGIN_ZC.kwargs]
distribution_restriction = "origin_specific_moments_zero_covariance"
# MUST match paper_five_family_seed_specs's own hardcoded ORIGIN_ZC K_mean/K_pair (generate_seeds.jl
# always uses that preset regardless of this per-chain config) -- K_mean=3 >= kstar=sigma-1=2
# activates the focal-omission/scatter_nu_eff path in load_seed_w0, confirmed live 2026-08-08 that
# using a smaller K_mean here (e.g. 1) than the seed file was generated with is a genuine
# seed/manifest inconsistency, not a cheaper equivalent test.
K_mean = 3
K_pair = 3
originzc_profiled_level = 2
power_target_layout = "origin_by_power"

[seeds]
generator = "generate_multistart_seeds"
family_specs = "paper_five_family_seed_specs"
number_of_starts = 1
include_calibration = true
randomized_noncalibration_starts = 0
seed_delta_max = 5.0
seed_delta_qualification_tolerance = 0.02
seed_requires_all_five_families = false
master_rng_seed = 0x00000000000000FF
A_scale = 0.02
gp_scale = 0.2
max_attempts = 1
min_seed_distance = 0.0
radius_mode = "uniform_radius"
initial_infeasible_restoration_budget_minutes = 0.5
output_dir = "seeds"

[algorithms]
primary = "pin_cg_lbfgs"
alternate = "direct_sr1"
opt_file = "csw_outer_wallclock_sr1.opt"
[algorithms.primary_kwargs]
pin_outer_algorithm = true
[algorithms.alternate_kwargs]
outer_direct_hessopt = "sr1"

[budgets]
maximum_discovery_cell_budget_minutes = 1.5
maximum_final_polish_cell_budget_minutes = 1.5

[budgets.discovery_feasible_start]
stage_A_primary_push_minutes = 0.5
stage_B_fixed_gp_restoration_minutes = 0.25
stage_C_alternate_push_minutes = 0.5

[budgets.discovery_infeasible_start]
stage_R0_initial_restoration_minutes = 0.25
stage_A_primary_push_minutes = 0.5
stage_B_fixed_gp_restoration_minutes = 0.25
stage_C_alternate_push_minutes = 0.5

[convergence]
material_improvement_window_major_iters = 10
material_gp_improvement_threshold = 1.0e-5
material_delta_improvement_threshold = 1.0e-4
stalled_no_improvement_window_minutes = 20
statuses = ["CONVERGED", "TIME_LIMIT_PROGRESSING", "TIME_LIMIT_STALLED", "NO_FEASIBLE_IMPROVEMENT",
            "START_NOT_RESTORED_TO_DELTA", "SOLVER_FAILURE", "CALLBACK_FAILURE"]

[checkpoint]
checkpoint_interval_s = 15.0
resume_bundle_format = "julia_serialization"
hard_refuse_hash_mismatch_on_resume = true
base_result_immutable = true
extension_root = "convergence_extensions"
